<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Wardrobe</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- ========================================= -->
    <!-- CABECERA -->
    <!-- ========================================= -->

    <header>

        <h1>My Wardrobe</h1>

        <p>
            Mi armario digital
        </p>

    </header>


    <main>


        <!-- ========================================= -->
        <!-- CATEGORÍAS -->
        <!-- ========================================= -->

        <section class="categorias">

            <div class="categorias-container">


                <button
                    type="button"
                    class="btn-categoria activa"
                    data-categoria="Todas"
                >
                    👕 Todas
                </button>


                <button
                    type="button"
                    id="btn-generar-outfit"
                    class="btn-generar-outfit"
                >
                    ✨ Generar outfit
                </button>


                <button
                    type="button"
                    class="btn-categoria"
                    data-categoria="Camisetas"
                >
                    Camisetas
                </button>


                <button
                    type="button"
                    class="btn-categoria"
                    data-categoria="Camisas"
                >
                    Camisas
                </button>


                <button
                    type="button"
                    class="btn-categoria"
                    data-categoria="Pantalones"
                >
                    Pantalones
                </button>


                <button
                    type="button"
                    class="btn-categoria"
                    data-categoria="Sudaderas"
                >
                    Sudaderas
                </button>


                <button
                    type="button"
                    class="btn-categoria"
                    data-categoria="Chaquetas"
                >
                    Chaquetas
                </button>


                <button
                    type="button"
                    class="btn-categoria"
                    data-categoria="Zapatos"
                >
                    Zapatos
                </button>


                <button
                    type="button"
                    class="btn-categoria"
                    data-categoria="Accesorios"
                >
                    Accesorios
                </button>


            </div>

        </section>



        <!-- ========================================= -->
        <!-- PRENDAS -->
        <!-- ========================================= -->

        <section class="prendas">


            <div class="titulo-prendas">


                <h2>
                    Mis prendas
                </h2>


                <button
                    type="button"
                    id="btn-nueva-prenda"
                >
                    + Añadir prenda
                </button>


            </div>



            <!-- ===================================== -->
            <!-- FORMULARIO -->
            <!-- ===================================== -->

            <div
                id="formulario-prenda"
                class="formulario-oculto"
            >


                <h3>
                    Nueva prenda
                </h3>



                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre de la prenda"
                >



                <select id="categoria">


                    <option value="">
                        Selecciona una categoría
                    </option>


                    <option value="Camisetas">
                        Camisetas
                    </option>


                    <option value="Camisas">
                        Camisas
                    </option>


                    <option value="Pantalones">
                        Pantalones
                    </option>


                    <option value="Sudaderas">
                        Sudaderas
                    </option>


                    <option value="Chaquetas">
                        Chaquetas
                    </option>


                    <option value="Zapatos">
                        Zapatos
                    </option>


                    <option value="Accesorios">
                        Accesorios
                    </option>


                </select>



                <input
                    type="text"
                    id="color"
                    placeholder="Color"
                >



                <input
                    type="text"
                    id="marca"
                    placeholder="Marca"
                >



                <input
                    type="file"
                    id="imagen"
                    accept="image/*"
                >



                <button
                    type="button"
                    id="btn-guardar-prenda"
                >
                    Guardar prenda
                </button>

                <p id="estado-subida" class="estado-subida"></p>


            </div>



            <!-- ===================================== -->
            <!-- LISTA DE PRENDAS -->
            <!-- ===================================== -->

            <div
                id="lista-prendas"
            >
            </div>


        </section>


    </main>



    <!-- ========================================= -->
    <!-- MODAL GENERAR OUTFIT -->
    <!-- ========================================= -->

    <div
        id="modal-outfit"
        class="modal-oculto"
    >


        <div class="modal-contenido">


            <h2>
                ¿Para qué ocasión quieres vestir?
            </h2>



            <div class="ocasiones-container">


                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Cena con amigos"
                >
                    🍽️ Cena con amigos
                </button>


                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Trabajo"
                >
                    💼 Trabajo
                </button>


                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Cita"
                >
                    ❤️ Cita
                </button>


                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Fiesta"
                >
                    🎉 Fiesta
                </button>


                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Casual"
                >
                    ☀️ Casual
                </button>


                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Playa"
                >
                    🏖️ Playa
                </button>


                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Deporte"
                >
                    🏃 Deporte
                </button>


            </div>



            <button
                type="button"
                id="btn-cerrar-modal"
                class="btn-cerrar-modal"
            >
                Cancelar
            </button>


        </div>


    </div>



    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->

    <script src="js/app.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Wardrove</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='72' text-anchor='middle' font-size='80'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =====================================================
         CABECERA
    ====================================================== -->

    <header class="cabecera">

        <div class="logo">
            ✦ My Wardrove
        </div>

        <button
            type="button"
            id="btn-nueva-prenda"
        >
            + Nueva prenda
        </button>

    </header>


    <!-- =====================================================
         HERO
    ====================================================== -->

    <section class="hero">

        <div class="hero-contenido">

            <p class="hero-pequeno">
                TU ARMARIO DIGITAL
            </p>

            <h1>
                Viste mejor.<br>
                Organiza mejor.
            </h1>

            <p class="hero-descripcion">
                Guarda tus prendas, organiza tu armario
                y crea tus propios outfits.
            </p>

            <button
                type="button"
                id="btn-ver-armario"
                class="btn-principal"
            >
                Ver mi armario
            </button>

        </div>

    </section>


    <!-- =====================================================
         ARMARIO
    ====================================================== -->

    <main
        id="seccion-armario"
        class="armario"
    >

        <div class="armario-cabecera">

            <div>

                <p class="seccion-pequena">
                    MI ARMARIO
                </p>

                <h2>
                    Mis prendas
                </h2>

            </div>

            <button
                type="button"
                id="btn-generar-outfit"
            >
                Crear outfit
            </button>

        </div>


        <!-- =================================================
             BUSCADOR
        ================================================== -->

        <div class="buscador-container">

            <input
                type="text"
                id="buscador-prendas"
                placeholder="Buscar prendas..."
            >

        </div>


        <!-- =================================================
             CATEGORÍAS
        ================================================== -->

        <div class="categorias">

            <button
                type="button"
                class="btn-categoria activa"
                data-categoria="Todas"
            >
                Todas
            </button>

            <button
                type="button"
                class="btn-categoria"
                data-categoria="Camisetas"
            >
                Camisetas
            </button>

            <button
                type="button"
                class="btn-categoria"
                data-categoria="Camisas"
            >
                Camisas
            </button>

            <button
                type="button"
                class="btn-categoria"
                data-categoria="Pantalones"
            >
                Pantalones
            </button>

            <button
                type="button"
                class="btn-categoria"
                data-categoria="Zapatos"
            >
                Zapatos
            </button>

            <button
                type="button"
                class="btn-categoria"
                data-categoria="Abrigos"
            >
                Abrigos
            </button>

            <button
                type="button"
                class="btn-categoria"
                data-categoria="Accesorios"
            >
                Accesorios
            </button>

        </div>


        <!-- =================================================
             LISTA DE PRENDAS

             IMPORTANTE:
             Al entrar en la web estará vacía.
             JavaScript la rellenará cuando pulsemos
             "Ver mi armario".
        ================================================== -->

        <div id="lista-prendas"></div>

    </main>


    <!-- =====================================================
         FORMULARIO NUEVA / EDITAR PRENDA
    ====================================================== -->

    <div
        id="formulario-prenda"
        class="formulario-oculto"
    >

        <button
            type="button"
            id="btn-cerrar-formulario"
            class="formulario-cerrar"
        >
            ×
        </button>


        <div class="formulario-header">

            <p class="seccion-pequena">
                MI ARMARIO
            </p>

            <h2>
                Añadir prenda
            </h2>

        </div>


        <div class="formulario-grid">

            <div class="campo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej. Camiseta blanca"
                >

            </div>


            <div class="campo">

                <label for="categoria">
                    Categoría
                </label>

                <select id="categoria">

                    <option value="">
                        Selecciona una categoría
                    </option>

                    <option value="Camisetas">
                        Camisetas
                    </option>

                    <option value="Camisas">
                        Camisas
                    </option>

                    <option value="Pantalones">
                        Pantalones
                    </option>

                    <option value="Zapatos">
                        Zapatos
                    </option>

                    <option value="Abrigos">
                        Abrigos
                    </option>

                    <option value="Accesorios">
                        Accesorios
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="color">
                    Color
                </label>

                <input
                    type="text"
                    id="color"
                    placeholder="Ej. Blanco"
                >

            </div>


            <div class="campo">

                <label for="marca">
                    Marca
                </label>

                <input
                    type="text"
                    id="marca"
                    placeholder="Ej. Nike"
                >

            </div>


            <div class="campo campo-imagen">

                <label for="imagen">
                    Fotografía
                </label>

                <input
                    type="file"
                    id="imagen"
                    accept="image/*"
                >

            </div>

        </div>


        <div class="formulario-footer">

            <button
                type="button"
                id="btn-guardar-prenda"
            >
                Guardar prenda
            </button>

            <p
                id="estado-subida"
                class="estado-subida"
            ></p>

        </div>

    </div>


    <!-- =====================================================
         MODAL CREAR OUTFIT
    ====================================================== -->

    <div
        id="modal-outfit"
        class="modal-oculto"
    >

        <div class="modal-contenido">

            <button
                type="button"
                id="btn-cerrar-modal"
                class="modal-cerrar"
            >
                ×
            </button>


            <div class="modal-header">

                <p class="seccion-pequena">
                    MY WARDROVE
                </p>

                <h2>
                    Crear outfit
                </h2>

                <p>
                    ¿Para qué ocasión quieres crear tu outfit?
                </p>

            </div>


            <div class="ocasiones-container">

                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Casual"
                >
                    Casual
                </button>

                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Trabajo"
                >
                    Trabajo
                </button>

                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Cita"
                >
                    Cita
                </button>

                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Deporte"
                >
                    Deporte
                </button>

                <button
                    type="button"
                    class="btn-ocasion"
                    data-ocasion="Fiesta"
                >
                    Fiesta
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MyWardrove - Avatar 3D</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #f5f5f5;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { GLTFLoader } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm";

import { OrbitControls } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js/+esm";


// =====================================================
// ESCENA
// =====================================================

const escena = new THREE.Scene();

escena.background =
    new THREE.Color(0xf5f5f5);


// =====================================================
// CÁMARA
// =====================================================

const camara =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

camara.position.set(
    0,
    1.1,
    3
);


// =====================================================
// RENDERER
// =====================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    window.devicePixelRatio
);

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// LUCES
// =====================================================

const luzAmbiente =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        2
    );

escena.add(luzAmbiente);


const luzDireccional =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

luzDireccional.position.set(
    2,
    3,
    3
);

escena.add(luzDireccional);


// =====================================================
// CONTROLES
// =====================================================

const controles =
    new OrbitControls(
        camara,
        renderer.domElement
    );

controles.target.set(
    0,
    1,
    0
);

controles.enableDamping = true;

controles.dampingFactor = 0.05;


// =====================================================
// GRUPO DE LA CAMISETA
// =====================================================

const grupoCamiseta =
    new THREE.Group();


// =====================================================
// TEXTURA
// =====================================================

const textureLoader =
    new THREE.TextureLoader();

const texturaCamiseta =
    textureLoader.load(

        "texturas/IMG_9106.png",

        function() {

            console.log(
                "Imagen de la camiseta cargada correctamente"
            );

        },

        undefined,

        function(error) {

            console.error(
                "Error cargando IMG_9106.png:",
                error
            );

        }
    );


// =====================================================
// CREAR CAMISETA
// =====================================================

function crearCamiseta(
    anchuraTorso,
    alturaTorso,
    profundidadTorso,
    centroTorso
) {

    // -------------------------------------------------
    // CUERPO
    // -------------------------------------------------

    const forma =
        new THREE.Shape();

    forma.moveTo(
        -0.25,
        -0.35
    );

    forma.lineTo(
        0.25,
        -0.35
    );

    forma.lineTo(
        0.25,
        0.35
    );

    forma.lineTo(
        -0.25,
        0.35
    );

    forma.lineTo(
        -0.25,
        -0.35
    );


    const geometriaCuerpo =
        new THREE.ExtrudeGeometry(
            forma,
            {
                depth: 0.30,
                bevelEnabled: false
            }
        );


    geometriaCuerpo.center();


    // -------------------------------------------------
    // CURVATURA
    // -------------------------------------------------

    const posicionVertices =
        geometriaCuerpo.attributes.position;

    for (
        let i = 0;
        i < posicionVertices.count;
        i++
    ) {

        const x =
            posicionVertices.getX(i);

        const z =
            posicionVertices.getZ(i);

        const nuevaZ =
            z + (x * x) * 0.35;

        posicionVertices.setZ(
            i,
            nuevaZ
        );
    }

    posicionVertices.needsUpdate = true;

    geometriaCuerpo.computeVertexNormals();


    // -------------------------------------------------
    // MATERIAL DEL CUERPO
    // -------------------------------------------------

    const materialCuerpo =
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.8,
            metalness: 0
        });


    const cuerpo =
        new THREE.Mesh(
            geometriaCuerpo,
            materialCuerpo
        );

    grupoCamiseta.add(
        cuerpo
    );


    // -------------------------------------------------
    // MEDIDAS
    // -------------------------------------------------

    const tamañoCamiseta =
        new THREE.Vector3();

    geometriaCuerpo.computeBoundingBox();

    geometriaCuerpo.boundingBox.getSize(
        tamañoCamiseta
    );


    // -------------------------------------------------
    // ESCALAS QUE YA HABÍAMOS AJUSTADO
    // -------------------------------------------------

    const escalaX =
        (anchuraTorso * 0.55) /
        tamañoCamiseta.x;

    const escalaY =
        (alturaTorso * 0.90) /
        tamañoCamiseta.y;

    const escalaZ =
        (profundidadTorso * 0.60) /
        tamañoCamiseta.z;


    grupoCamiseta.scale.set(
        escalaX,
        escalaY,
        escalaZ
    );


    // -------------------------------------------------
    // POSICIÓN QUE YA FUNCIONABA
    // -------------------------------------------------

    const posicionX =
        centroTorso.x;

    const posicionY =
        centroTorso.y;

    const posicionZ =
        centroTorso.z;


    grupoCamiseta.position.set(
        posicionX,
        posicionY,
        posicionZ + 0.02
    );


    // -------------------------------------------------
    // FOTO EN EL FRONTAL
    // -------------------------------------------------

    const geometriaFrontal =
        new THREE.PlaneGeometry(
            0.47,
            0.58
        );


    // MeshBasicMaterial:
    // la fotografía no depende de las luces

    const materialFrontal =
        new THREE.MeshBasicMaterial({

            map: texturaCamiseta,

            transparent: true,

            side: THREE.DoubleSide

        });


    const frontal =
        new THREE.Mesh(
            geometriaFrontal,
            materialFrontal
        );


    // Un poco por delante del cuerpo

    frontal.position.set(
        0,
        0,
        0.155
    );


    grupoCamiseta.add(
        frontal
    );


    // -------------------------------------------------
    // MANGAS
    // -------------------------------------------------

    const geometriaManga =
        new THREE.BoxGeometry(
            0.07,
            0.15,
            0.20
        );


    const materialManga =
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.8
        });


    const mangaIzquierda =
        new THREE.Mesh(
            geometriaManga,
            materialManga
        );


    mangaIzquierda.position.set(
        -0.175,
        0.20,
        0
    );

    mangaIzquierda.rotation.z =
        -0.10;


    grupoCamiseta.add(
        mangaIzquierda
    );


    const mangaDerecha =
        new THREE.Mesh(
            geometriaManga.clone(),
            materialManga
        );


    mangaDerecha.position.set(
        0.175,
        0.20,
        0
    );

    mangaDerecha.rotation.z =
        0.10;


    grupoCamiseta.add(
        mangaDerecha
    );


    // -------------------------------------------------
    // CUELLO
    // -------------------------------------------------

    const geometriaCuello =
        new THREE.TorusGeometry(
            0.055,
            0.012,
            12,
            32
        );


    const materialCuello =
        new THREE.MeshStandardMaterial({
            color: 0xe5e5e5,
            roughness: 0.8
        });


    const cuello =
        new THREE.Mesh(
            geometriaCuello,
            materialCuello
        );


    cuello.rotation.x =
        Math.PI / 2;


    cuello.position.set(
        0,
        0.235,
        0.105
    );


    grupoCamiseta.add(
        cuello
    );
}


// =====================================================
// CARGAR AVATAR
// =====================================================

const loader =
    new GLTFLoader();


loader.load(

    "models/cyborg.glb",

    function(gltf) {

        const avatar =
            gltf.scene;


        escena.add(
            avatar
        );


        // -------------------------------------------------
        // MEDIDAS AVATAR
        // -------------------------------------------------

        const cajaAvatar =
            new THREE.Box3()
                .setFromObject(avatar);


        const tamañoAvatar =
            new THREE.Vector3();

        cajaAvatar.getSize(
            tamañoAvatar
        );


        const centroAvatar =
            new THREE.Vector3();

        cajaAvatar.getCenter(
            centroAvatar
        );


        console.log(
            "Anchura avatar:",
            tamañoAvatar.x
        );

        console.log(
            "Altura avatar:",
            tamañoAvatar.y
        );

        console.log(
            "Profundidad avatar:",
            tamañoAvatar.z
        );

        console.log(
            "Centro avatar:",
            centroAvatar
        );


        // -------------------------------------------------
        // BUSCAR TORSO
        // -------------------------------------------------

        let torso =
            null;


        avatar.traverse(
            function(objeto) {

                if (
                    objeto.name ===
                    "Wolf3D_Outfit_Top"
                ) {

                    torso =
                        objeto;

                }

            }
        );


        if (!torso) {

            console.error(
                "No se encontró Wolf3D_Outfit_Top"
            );

            return;
        }


        // -------------------------------------------------
        // MEDIDAS DEL TORSO
        // -------------------------------------------------

        const cajaTorso =
            new THREE.Box3()
                .setFromObject(torso);


        const tamañoTorso =
            new THREE.Vector3();

        cajaTorso.getSize(
            tamañoTorso
        );


        const centroTorso =
            new THREE.Vector3();

        cajaTorso.getCenter(
            centroTorso
        );


        console.log(
            "Anchura torso:",
            tamañoTorso.x
        );

        console.log(
            "Altura torso:",
            tamañoTorso.y
        );

        console.log(
            "Profundidad torso:",
            tamañoTorso.z
        );

        console.log(
            "Centro torso:",
            centroTorso
        );


        // -------------------------------------------------
        // CREAR CAMISETA
        // -------------------------------------------------

        crearCamiseta(

            tamañoTorso.x,

            tamañoTorso.y,

            tamañoTorso.z,

            centroTorso

        );


        escena.add(
            grupoCamiseta
        );

    },

    undefined,

    function(error) {

        console.error(
            "Error cargando el avatar:",
            error
        );

    }
);


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    function() {

        camara.aspect =
            window.innerWidth /
            window.innerHeight;

        camara.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// =====================================================
// ANIMACIÓN
// =====================================================

function animar() {

    requestAnimationFrame(
        animar
    );

    controles.update();

    renderer.render(
        escena,
        camara
    );
}


animar();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>My Wardrove - Avatar 3D</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { GLTFLoader } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm";

import { OrbitControls } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js/+esm";


// ========================================
// ESCENA
// ========================================

const escena = new THREE.Scene();

escena.background = new THREE.Color(0xf5f5f5);


// ========================================
// CÁMARA
// ========================================

const camara = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camara.position.set(0, 1.1, 3);


// ========================================
// RENDERER
// ========================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


// ========================================
// LUCES
// ========================================

const luzAmbiente =
    new THREE.HemisphereLight(
        0xffffff,
        0x888888,
        2
    );

escena.add(luzAmbiente);


const luzDireccional =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

luzDireccional.position.set(
    2,
    3,
    4
);

escena.add(luzDireccional);


// ========================================
// CONTROLES
// ========================================

const controles =
    new OrbitControls(
        camara,
        renderer.domElement
    );

controles.target.set(
    0,
    1,
    0
);

controles.enableDamping = true;

controles.dampingFactor = 0.05;


// ========================================
// CARGAR TEXTURA
// ========================================

const textureLoader =
    new THREE.TextureLoader();

const texturaCamiseta =
    textureLoader.load(
        "texturas/IMG_9106.jpg",

        function() {
            console.log(
                "Imagen de la camiseta cargada correctamente"
            );
        },

        undefined,

        function(error) {
            console.error(
                "Error cargando IMG_9106.jpg:",
                error
            );
        }
    );

texturaCamiseta.colorSpace =
    THREE.SRGBColorSpace;

texturaCamiseta.wrapS =
    THREE.ClampToEdgeWrapping;

texturaCamiseta.wrapT =
    THREE.ClampToEdgeWrapping;


// ========================================
// CREAR CAMISETA
// ========================================

function crearCamiseta(
    anchuraTorso,
    alturaTorso,
    profundidadTorso,
    posicionX,
    posicionY,
    posicionZ
) {

    const grupoCamiseta =
        new THREE.Group();


    // ====================================
    // CUERPO DE LA CAMISETA
    // ====================================

    const formaCuerpo =
        new THREE.Shape();

    formaCuerpo.moveTo(
        -0.15,
        -0.32
    );

    formaCuerpo.lineTo(
        0.15,
        -0.32
    );

    formaCuerpo.lineTo(
        0.16,
        0.18
    );

    formaCuerpo.lineTo(
        0.17,
        0.23
    );

    formaCuerpo.lineTo(
        0.12,
        0.27
    );

    formaCuerpo.lineTo(
        0.07,
        0.21
    );

    formaCuerpo.lineTo(
        -0.07,
        0.21
    );

    formaCuerpo.lineTo(
        -0.12,
        0.27
    );

    formaCuerpo.lineTo(
        -0.17,
        0.23
    );

    formaCuerpo.lineTo(
        -0.16,
        0.18
    );

    formaCuerpo.closePath();


    const geometriaCuerpo =
        new THREE.ExtrudeGeometry(
            formaCuerpo,
            {
                depth: 0.20,
                bevelEnabled: true,
                bevelSegments: 2,
                bevelSize: 0.01,
                bevelThickness: 0.01
            }
        );

    geometriaCuerpo.center();


    // ====================================
    // CURVATURA
    // ====================================

    const posicionVertices =
        geometriaCuerpo.attributes.position;

    for (
        let i = 0;
        i < posicionVertices.count;
        i++
    ) {

        const x =
            posicionVertices.getX(i);

        const z =
            posicionVertices.getZ(i);

        const nuevaZ =
            z + (x * x) * 0.35;

        posicionVertices.setZ(
            i,
            nuevaZ
        );
    }

    posicionVertices.needsUpdate = true;

    geometriaCuerpo.computeVertexNormals();


    // ====================================
    // MATERIAL
    // ====================================

    const materialCamiseta =
        new THREE.MeshStandardMaterial({
            map: texturaCamiseta,
            roughness: 0.8,
            metalness: 0
        });


    // ====================================
    // CUERPO
    // ====================================

    const cuerpo =
        new THREE.Mesh(
            geometriaCuerpo,
            materialCamiseta
        );

    grupoCamiseta.add(
        cuerpo
    );


    // ====================================
    // MANGAS
    // ====================================

    const geometriaManga =
        new THREE.BoxGeometry(
            0.07,
            0.15,
            0.20
        );


    // MANGA IZQUIERDA

    const mangaIzquierda =
        new THREE.Mesh(
            geometriaManga,
            materialCamiseta
        );

    mangaIzquierda.position.set(
        -0.175,
        0.20,
        0
    );

    mangaIzquierda.rotation.z =
        -0.10;

    grupoCamiseta.add(
        mangaIzquierda
    );


    // MANGA DERECHA

    const mangaDerecha =
        new THREE.Mesh(
            geometriaManga,
            materialCamiseta
        );

    mangaDerecha.position.set(
        0.175,
        0.20,
        0
    );

    mangaDerecha.rotation.z =
        0.10;

    grupoCamiseta.add(
        mangaDerecha
    );


    // ====================================
    // CUELLO
    // ====================================

    const geometriaCuello =
        new THREE.TorusGeometry(
            0.055,
            0.012,
            12,
            32
        );


    const materialCuello =
        new THREE.MeshStandardMaterial({
            color: 0xe5e5e5,
            roughness: 0.8
        });


    const cuello =
        new THREE.Mesh(
            geometriaCuello,
            materialCuello
        );

    cuello.rotation.x =
        Math.PI / 2;

    cuello.position.set(
        0,
        0.235,
        0.105
    );

    grupoCamiseta.add(
        cuello
    );


    // ====================================
    // MEDIDAS
    // ====================================

    const tamañoCamiseta =
        new THREE.Box3()
            .setFromObject(
                grupoCamiseta
            )
            .getSize(
                new THREE.Vector3()
            );


    // ====================================
    // ESCALA
    // ====================================

    // Anchura = 55%

    const escalaX =
        (anchuraTorso * 0.55) /
        tamañoCamiseta.x;


    // Altura = 90%

    const escalaY =
        (alturaTorso * 0.90) /
        tamañoCamiseta.y;


    // Profundidad = 60%

    const escalaZ =
        (profundidadTorso * 0.60) /
        tamañoCamiseta.z;


    grupoCamiseta.scale.set(
        escalaX,
        escalaY,
        escalaZ
    );


    // ====================================
    // POSICIÓN
    // ====================================

    grupoCamiseta.position.set(
        posicionX,
        posicionY,
        posicionZ + 0.02
    );


    // ====================================
    // AÑADIR A ESCENA
    // ====================================

    escena.add(
        grupoCamiseta
    );
}


// ========================================
// CARGAR AVATAR
// ========================================

const loader =
    new GLTFLoader();


loader.load(

    "models/cyborg.glb",

    function(gltf) {

        const avatar =
            gltf.scene;

        escena.add(
            avatar
        );


        let topAvatar = null;


        // =================================
        // BUSCAR TORSO
        // =================================

        avatar.traverse(
            function(objeto) {

                if (
                    objeto.isMesh &&
                    objeto.name ===
                    "Wolf3D_Outfit_Top"
                ) {

                    topAvatar =
                        objeto;
                }

            }
        );


        if (!topAvatar) {

            console.error(
                "No se encontró Wolf3D_Outfit_Top"
            );

            return;
        }


        // =================================
        // MEDIDAS DEL TORSO
        // =================================

        const cajaTop =
            new THREE.Box3()
                .setFromObject(
                    topAvatar
                );


        const tamañoTop =
            cajaTop.getSize(
                new THREE.Vector3()
            );


        const centroTop =
            cajaTop.getCenter(
                new THREE.Vector3()
            );


        console.log(
            "Anchura torso:",
            tamañoTop.x
        );

        console.log(
            "Altura torso:",
            tamañoTop.y
        );

        console.log(
            "Profundidad torso:",
            tamañoTop.z
        );

        console.log(
            "Centro torso:",
            centroTop
        );


        // =================================
        // CREAR CAMISETA
        // =================================

        crearCamiseta(

            tamañoTop.x,
            tamañoTop.y,
            tamañoTop.z,

            centroTop.x,
            centroTop.y,
            centroTop.z

        );

    },

    undefined,

    function(error) {

        console.error(
            "Error cargando el avatar:",
            error
        );

    }
);


// ========================================
// RESIZE
// ========================================

window.addEventListener(
    "resize",
    function() {

        camara.aspect =
            window.innerWidth /
            window.innerHeight;

        camara.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ========================================
// ANIMACIÓN
// ========================================

function animar() {

    requestAnimationFrame(
        animar
    );

    controles.update();

    renderer.render(
        escena,
        camara
    );
}

animar();

</script>

</body>
</html>
